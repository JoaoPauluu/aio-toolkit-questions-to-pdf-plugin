[project]
name = "aio-assignment-pdf"
version = "1.0.0"
description = "AIO Toolkit community plugin: exam JSON + images -> LaTeX template -> PDF."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
